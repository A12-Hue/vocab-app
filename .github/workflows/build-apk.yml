name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Java 环境
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: 设置 Flutter 环境
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: 获取依赖
      run: flutter pub get
    
    - name: 构建 APK
      run: flutter build apk --release
    
    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: vocab-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
